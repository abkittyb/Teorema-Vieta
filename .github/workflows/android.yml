name: Build Android APK
on:
  push:
    branches: [codex/android-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake autopoint gettext libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev lld
          python -m pip install git+https://github.com/kivy/buildozer@76bac28545c66bbcc671d49aca553a747d69608e Cython==0.29.34 setuptools legacy-cgi
      - name: Configure Android build
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cat > buildozer.spec <<'SPEC'
          [app]
          title = Теорема Виета
          package.name = vietatrainer
          package.domain = ru.abkittyb
          source.dir = .
          source.include_exts = py,kv,png,jpg,atlas,ttf
          source.exclude_patterns = TR.Vieta.py
          version = 0.1.1
          requirements = python3,kivy==2.3.1,filetype==1.2.0,charset-normalizer==2.1.1
          orientation = portrait
          fullscreen = 0
          android.api = 36
          android.minapi = 24
          android.ndk = 28c
          android.archs = TARGET_ARCH
          android.accept_sdk_license = True
          android.debug_artifact = apk
          p4a.branch = v2026.05.09
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          sed -i "s/TARGET_ARCH/$TARGET_ARCH/" buildozer.spec
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vieta-0.1.1-${{ matrix.arch }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Start on Android 16 emulator
        if: matrix.arch == 'x86_64'
        timeout-minutes: 15
        run: |
          mkdir -p diagnostics
          sudo chmod 666 /dev/kvm
          sdkmanager 'emulator' 'system-images;android-36;google_apis;x86_64'
          echo no | avdmanager create avd -n vieta-test -k 'system-images;android-36;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd vieta-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > diagnostics/emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb install bin/*.apk
          adb logcat -c
          adb shell am start -W -n ru.abkittyb.vietatrainer/org.kivy.android.PythonActivity
          sleep 20
          adb logcat -d > diagnostics/logcat.txt
          adb exec-out screencap -p > diagnostics/start.png
          adb shell pidof ru.abkittyb.vietatrainer
          if grep -q 'Traceback (most recent call last)' diagnostics/logcat.txt; then exit 1; fi
      - name: Upload launch diagnostics
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: android-16-launch-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
