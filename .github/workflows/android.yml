name: Build Android APK
on:
  push:
    branches: [codex/android-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          python -m pip install buildozer==1.5.0 Cython==0.29.34 setuptools
      - name: Configure Android build
        run: |
          cat > buildozer.spec <<'SPEC'
          [app]
          title = Теорема Виета
          package.name = vietatrainer
          package.domain = ru.abkittyb
          source.dir = .
          source.include_exts = py,kv,png,jpg,atlas,ttf
          source.exclude_patterns = TR.Vieta.py
          version = 0.1.0
          requirements = python3,kivy==2.3.1
          orientation = portrait
          fullscreen = 0
          android.api = 35
          android.minapi = 23
          android.ndk = 25b
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.debug_artifact = apk
          p4a.branch = v2024.01.21
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Build debug APK
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vieta-android-debug
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
