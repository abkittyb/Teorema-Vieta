name: Build Android APK
on:
  push:
    branches: [codex/android-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: vieta-modern-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: vieta-modern-${{ matrix.arch }}-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake autopoint gettext libtool libtool-bin libltdl-dev pkg-config zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev lld
          python -m pip install git+https://github.com/kivy/buildozer@76bac28545c66bbcc671d49aca553a747d69608e Cython==0.29.34 setuptools legacy-cgi
      - name: Configure Android build
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          cat > buildozer.spec <<'SPEC'
          [app]
          title = Теорема Виета
          package.name = vietatrainer
          package.domain = ru.abkittyb
          source.dir = .
          source.include_exts = py,kv,png,jpg,atlas,ttf
          source.exclude_patterns = TR.Vieta.py
          version = 0.1.2
          requirements = python3,kivy==2.3.1,filetype==1.2.0,charset_normalizer==2.1.1,chardet==5.2.0
          orientation = portrait
          fullscreen = 0
          android.api = 36
          android.minapi = 24
          android.ndk = 28c
          android.archs = TARGET_ARCH
          android.accept_sdk_license = True
          android.debug_artifact = apk
          p4a.branch = v2026.05.09
          [buildozer]
          log_level = 2
          warn_on_root = 1
          SPEC
          sed -i "s/TARGET_ARCH/$TARGET_ARCH/" buildozer.spec
          printf "charset-normalizer==2.1.1\nchardet==5.2.0\n" > android-constraints.txt
      - name: Refresh cached Python packaging
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          root = Path('.buildozer/android/platform')
          for p in root.glob('build-*/build/venv'):
              shutil.rmtree(p)
          for p in root.glob('build-*/dists'):
              shutil.rmtree(p)
          for p in root.rglob('*mypyc*.so'):
              p.unlink()
          for site in root.glob('build-*/build/python-installs/*/*'):
              for pattern in ('chardet', 'chardet-*.dist-info', '*mypyc*.so'):
                  for p in site.glob(pattern):
                      if p.is_dir(): shutil.rmtree(p)
                      else: p.unlink()
          PY
      - name: Check Python syntax
        run: python -m py_compile main.py
      - name: Build debug APK
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/android-constraints.txt
        run: buildozer -v android debug
      - name: Verify APK dependency and 16 KB ELF alignment
        run: |
          python - <<'PY'
          import glob, io, struct, tarfile, zipfile
          def check(name, data):
              if data[:4] != b'\x7fELF': return
              pos = struct.unpack_from('<Q', data, 32)[0]
              size, count = struct.unpack_from('<HH', data, 54)
              for i in range(count):
                  kind, flags, offset, va, pa, fs, ms, align = struct.unpack_from('<IIQQQQQQ', data, pos+i*size)
                  if kind == 1:
                      assert align >= 16384 and offset % 16384 == va % 16384, name
          for path in glob.glob('bin/*.apk'):
              with zipfile.ZipFile(path) as apk:
                  assert apk.testzip() is None
                  found = False
                  for name in apk.namelist():
                      if not name.startswith('lib/') or not name.endswith('.so'): continue
                      data = apk.read(name)
                      if 'libpybundle' not in name:
                          check(name, data)
                      else:
                          with tarfile.open(fileobj=io.BytesIO(data)) as bundle:
                              for m in bundle.getmembers():
                                  if '/filetype/__init__.pyc' in m.name: found = True
                                  if m.isfile() and m.name.endswith('.so'): check(m.name, bundle.extractfile(m).read())
                  assert found, 'filetype is missing'
                  print(path, 'PASS: filetype and 16 KB ELF alignment')
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vieta-0.1.2-${{ matrix.arch }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Start on Android 16 emulator
        if: matrix.arch == 'x86_64'
        timeout-minutes: 15
        run: |
          mkdir -p diagnostics
          sudo chmod 666 /dev/kvm
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then cp -a "$ANDROID_HOME/tools" "$ANDROID_HOME/cmdline-tools/latest"; fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          sdkmanager --sdk_root="$ANDROID_HOME" 'emulator' 'system-images;android-36;google_apis;x86_64'
          echo no | avdmanager create avd -n vieta-test -k 'system-images;android-36;google_apis;x86_64' --force
          "$ANDROID_HOME/emulator/emulator" -avd vieta-test -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > diagnostics/emulator.log 2>&1 &
          emulator_pid=$!
          sleep 5
          kill -0 "$emulator_pid" || { cat diagnostics/emulator.log; exit 1; }
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb install bin/*.apk
          adb logcat -c
          adb shell am start -W -n ru.abkittyb.vietatrainer/org.kivy.android.PythonActivity
          sleep 20
          adb logcat -d > diagnostics/logcat.txt
          adb exec-out screencap -p > diagnostics/start.png
          adb shell pidof ru.abkittyb.vietatrainer
          if grep -q 'Traceback (most recent call last)' diagnostics/logcat.txt; then exit 1; fi
      - name: Upload launch diagnostics
        if: always() && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: android-16-launch-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: vieta-modern-${{ matrix.arch }}-${{ github.run_id }}
